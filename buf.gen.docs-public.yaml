# managed section must stay in sync with buf.gen.yaml

version: v2

managed:
  enabled: true
  override:
  - file_option: go_package_prefix
    value: github.com/osac-project/fulfillment-service/internal/api
  disable:
  - module: buf.build/googleapis/googleapis
  - module: buf.build/grpc-ecosystem/grpc-gateway

inputs:
- directory: proto/public

plugins:
- local: protoc-gen-doc
  out: docs/reference
  opt:
  - markdown,api-public.md

- remote: buf.build/grpc-ecosystem/openapiv2:v2.26.1
  out: docs/openapi
  opt:
  - allow_merge=true
  - merge_file_name=osac-public
