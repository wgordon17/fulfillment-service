name: Dispatch docs rebuild

on:
  push:
    branches: [main]
    paths:
    - 'proto/**'
    - 'internal/cmd/cli/**'
    - 'docs/**'

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
    - name: Trigger docs site rebuild
      id: dispatch
      continue-on-error: true
      run: |
        gh api repos/osac-project/docs/dispatches \
          --method POST \
          -f event_type=docs-update \
          -f "client_payload[repo]=fulfillment-service"
      env:
        GH_TOKEN: ${{ secrets.DOCS_DISPATCH_PAT }}
    - name: Warn on dispatch failure
      if: steps.dispatch.outcome == 'failure'
      run: |
        echo "::warning::Docs dispatch failed — PAT may be expired or missing. See Task 13 Step 2 in the docs generation plan."
